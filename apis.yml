x-developer-surface: none
x-developer-surface-notes: >-
  Duane Morris LLP publishes no public developer API, SDK, CLI, OpenAPI or
  AsyncAPI specification, JSON Schema, GraphQL endpoint, webhooks, status
  page, or developer portal. The GitHub organization at
  https://github.com/duanemorris exists but holds no public repositories.
  The only machine-readable surfaces produced by the firm are the RSS 2.0
  feeds exposed by its LexBlog-hosted blog network — more than 50 practice
  and industry blogs at blogs.duanemorris.com (and the Duane Morris Institute
  at duanemorrisinstitute.com), each reachable via the standard WordPress
  /feed/ convention. RSS validity has been spot-confirmed on the Class
  Action Defense, Cannabis Industry, Artificial Intelligence, and Duane
  Morris Institute feeds.
