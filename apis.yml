aid: duane-morris
name: Duane Morris
description: >-
  Duane Morris LLP is a Philadelphia-headquartered, full-service U.S. and
  international law firm founded in 1904 by Russell Duane, Steven Heckscher,
  and Roland S. Morris. Chaired by Matthew A. Taylor, the firm describes
  itself as "a law firm with more than 900 attorneys in offices across the
  United States and internationally" — with a U.S. footprint spanning the
  East Coast, Texas, the Mountain West, and California, plus international
  offices in London, Singapore, Vietnam (Hanoi, Ho Chi Minh City), Shanghai,
  Myanmar, and joint ventures/alliances reaching Mexico and Latin America.
  An Am Law 100 firm since 2001, Duane Morris is known for depth in
  intellectual property (including patent prosecution and PTAB practice),
  trial and appellate litigation, real estate, corporate transactions,
  employment, healthcare, cannabis, and life sciences. The firm publishes an
  extensive LexBlog-powered thought-leadership network of more than 50
  practice-area blogs, all of which expose RSS 2.0 feeds via the standard
  WordPress /feed/ convention. Duane Morris does not expose any public
  developer API, SDK, OpenAPI/AsyncAPI spec, GraphQL endpoint, webhooks,
  status page, or developer portal; the GitHub organization
  github.com/duanemorris exists but has no public repositories. The firm's
  only machine-readable surfaces are the RSS feeds of its blog network.
